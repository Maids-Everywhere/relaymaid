name: relaymaid

services:
  api:
    build:
      context: ./backend
    environment:
      RELAYMAID_ENVIRONMENT: ${RELAYMAID_ENVIRONMENT:-local}
      RELAYMAID_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-relaymaid}:${POSTGRES_PASSWORD:-relaymaid}@postgres:5432/${POSTGRES_DB:-relaymaid}
      RELAYMAID_REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      JWT_SECRET_TOKEN: ${JWT_SECRET_TOKEN:?JWT_SECRET_TOKEN is required}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:-relaymaid_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?POSTGRES_BOOTSTRAP_PASSWORD is required}

      RELAYMAID_DB_NAME: ${RELAYMAID_DB_NAME:-relaymaid}
      RELAYMAID_MIGRATOR_USER: ${RELAYMAID_MIGRATOR_USER:-relaymaid_migrator}
      RELAYMAID_MIGRATOR_PASSWORD: ${RELAYMAID_MIGRATOR_PASSWORD:?RELAYMAID_MIGRATOR_PASSWORD is required}
      RELAYMAID_APP_USER: ${RELAYMAID_APP_USER:-relaymaid_app}
      RELAYMAID_APP_PASSWORD: ${RELAYMAID_APP_PASSWORD:?RELAYMAID_APP_PASSWORD is required}

    ports:
      - "5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_BOOTSTRAP_USER:-relaymaid_bootstrap} -d ${POSTGRES_DB:-postgres}" ]
      interval: 5s
      timeout: 3s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
