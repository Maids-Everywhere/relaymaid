[project]
name = "relaymaid"
version = "0.1.0"
description = "Reliable webhook delivery for multi-tenant applications"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2.0",
    "email-validator>=2.3.0",
    "fastapi>=0.116,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.17,<2.0",
    "pytest>=8.4,<9.0",
    "pytest-cov>=6.2,<7.0",
    "ruff>=0.12,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relaymaid"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: tests requiring PostgreSQL",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["relaymaid"]
